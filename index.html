<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Meu Treino">
    <meta name="theme-color" content="#0b0f19">
    <title>Meu Treino Diário | Pro Workout</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(22, 30, 46, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            --accent-glow: rgba(56, 189, 248, 0.35);
            --success-color: #10b981;
            --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;
            --radius-xl: 22px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(129, 140, 248, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: calc(150px + var(--safe-area-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-wrapper {
            width: 100%;
            max-width: 768px;
            padding: 16px 16px 0 16px;
        }

        header {
            margin-bottom: 20px;
            padding: 12px 4px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title i { -webkit-text-fill-color: var(--accent-primary); }

        .today-badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-primary);
            border: 1px solid rgba(56, 189, 248, 0.25);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .progress-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow-card);
        }

        .user-info-banner {
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-gradient);
            border-radius: 10px;
            transition: width 0.4s ease;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .day-tabs-container {
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(20px);
            padding: 10px 0;
            margin-left: -16px;
            margin-right: -16px;
            padding-left: 16px;
            padding-right: 16px;
        }

        .day-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .day-tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            flex: 0 0 auto;
            padding: 10px 18px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: var(--radius-md);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tab-btn.active {
            background: var(--accent-gradient);
            color: #ffffff;
            border-color: var(--accent-primary);
            box-shadow: 0 4px 16px var(--accent-glow);
            transform: translateY(-2px);
        }

        .day-section { display: none; animation: fadeIn 0.35s ease-out; }
        .day-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .section-header {
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .section-title { font-size: 1.2rem; font-weight: 800; color: var(--text-main); }

        .exercise-list { display: flex; flex-direction: column; gap: 14px; }

        .exercise-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 14px;
            box-shadow: var(--shadow-card);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .exercise-card.completed { border-color: var(--success-color); background: rgba(16, 185, 129, 0.05); }

        .exercise-main-row { display: flex; align-items: center; gap: 14px; cursor: pointer; }

        .checkbox-btn {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: 2px solid var(--accent-primary);
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .exercise-card.completed .checkbox-btn { background: var(--success-gradient); border-color: transparent; color: #fff; }

        .ex-img-wrapper {
            width: 68px;
            height: 68px;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #000;
            border: 1px solid var(--card-border);
            flex-shrink: 0;
        }

        .ex-img { width: 100%; height: 100%; object-fit: cover; }

        .ex-title { font-size: 0.98rem; font-weight: 700; color: var(--text-main); }

        .anatomy-info { font-size: 0.72rem; margin-top: 4px; line-height: 1.3; }
        .primary-muscle { color: var(--accent-primary); font-weight: 700; }
        .secondary-muscles { color: var(--text-muted); }

        .why-tag {
            font-size: 0.68rem;
            color: var(--success-color);
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            margin-top: 5px;
            display: inline-block;
        }

        .load-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }

        .load-input {
            width: 50px;
            background: transparent;
            border: none;
            color: var(--accent-primary);
            font-weight: 700;
            outline: none;
            text-align: right;
            font-family: inherit;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(8px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--bg-dark);
            width: 100%;
            max-width: 540px;
            border: 1px solid var(--accent-primary);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .form-select, .form-input {
            width: 100%;
            padding: 14px;
            background: #161e2e;
            border: 2px solid var(--card-border);
            border-radius: 12px;
            color: #fff;
            margin-top: 8px;
            appearance: none;
            font-family: inherit;
        }

        .form-select:focus, .form-input:focus { border-color: var(--accent-primary); outline: none; }

        .form-select option { background: #161e2e; color: #fff; }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .action-btn-sm {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .action-btn-sm:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        .action-btn-sm.delete:hover { border-color: var(--danger-color); color: var(--danger-color); background: rgba(239,68,68,0.1); }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            padding: 12px 16px calc(12px + var(--safe-area-bottom));
            z-index: 1000;
        }

        .nav-content { width: 100%; max-width: 768px; margin: 0 auto; display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-action { flex: 1; min-width: 90px; padding: 12px 6px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 0.75rem; text-align: center; }
        .btn-gen { background: var(--success-gradient); color: #fff; }
        .btn-add-ex { background: var(--accent-gradient); color: #fff; }
        .btn-profile { background: rgba(56, 189, 248, 0.12); color: var(--accent-primary); border: 1px solid rgba(56, 189, 248, 0.3); }
        .btn-logout { background: rgba(239, 68, 68, 0.12); color: var(--danger-color); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-logout:hover { background: rgba(239, 68, 68, 0.25); }

        .profile-card-item {
            background: rgba(22, 30, 46, 0.9);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }
        .profile-card-item.active-profile {
            border-color: var(--accent-primary);
            background: rgba(56, 189, 248, 0.08);
        }

        .ex-lib-card {
            background: rgba(22, 30, 46, 0.6);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .ex-lib-card:hover { border-color: var(--accent-primary); }

        @media (min-width: 640px) {
            .exercise-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <header>
            <div class="header-top">
                <div class="brand-title"><i class="fa-solid fa-dumbbell"></i> MEU TREINO PRO</div>
                <div class="today-badge" id="badgeName"><i class="fa-solid fa-user"></i> PERFIL</div>
            </div>

            <div class="progress-card">
                <div class="progress-info">
                    <span>Evolução da Semana</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
                <div class="user-info-banner" id="userInfoBanner">
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </header>

        <div class="day-tabs-container">
            <div class="day-tabs" id="dayTabs">
                <button class="tab-btn active" onclick="switchDay(0)">SEG<span style="font-size:0.6rem">Treino A</span></button>
                <button class="tab-btn" onclick="switchDay(1)">TER<span style="font-size:0.6rem">Treino B</span></button>
                <button class="tab-btn" onclick="switchDay(2)">QUA<span style="font-size:0.6rem">Treino C</span></button>
                <button class="tab-btn" onclick="switchDay(3)">QUI<span style="font-size:0.6rem">Treino D</span></button>
                <button class="tab-btn" onclick="switchDay(4)">SEX<span style="font-size:0.6rem">Treino E</span></button>
            </div>
        </div>

        <main id="workout-container">
            <!-- Os treinos serão injetados aqui -->
        </main>
    </div>

    <!-- [MODAL: SELEÇÃO DE PERFIL / QUESTIONÁRIO] -->
    <div class="modal-overlay" id="onboardingModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
                <h2 style="color: var(--accent-primary); font-size:1.3rem;" id="modalTitle">Perfis do Sistema</h2>
                <button id="closeProfileModalBtn" onclick="closeProfileModal()" style="display:none; background:none; border:none; color:var(--text-muted); font-size:1.4rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Lista de Perfis Existentes -->
            <div id="profilesListSection" style="display:none; margin-bottom: 15px;">
                <label style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px; display:block;">Selecione um Perfil Salvo:</label>
                <div id="profilesContainer" style="max-height: 40vh; overflow-y: auto;">
                    <!-- Preenchido via JS -->
                </div>
                <button class="action-btn-sm" style="width:100%; padding:10px; margin-top:10px; justify-content:center; background:rgba(56, 189, 248, 0.1); color:var(--accent-primary);" onclick="showQuestionnaireForm()">
                    <i class="fa-solid fa-user-plus"></i> + CRIAR NOVO PERFIL
                </button>
            </div>

            <!-- Formulário de Questionário / Criar Perfil -->
            <div id="questionnaireSection">
                <h3 style="font-size:1rem; color:var(--text-main); margin-bottom:10px;">Preencha seu Questionário:</h3>
                <div style="max-height: 55vh; overflow-y: auto; padding-right: 5px;">
                    <div class="form-group">
                        <label style="font-size: 0.8rem; color: var(--text-muted)">Nome</label>
                        <input type="text" id="regName" class="form-input" placeholder="Seu nome">
                    </div>
                    <div style="display:flex; gap:10px; margin-top: 10px;">
                        <div style="flex:1">
                            <label style="font-size: 0.8rem; color: var(--text-muted)">Peso (kg)</label>
                            <input type="number" id="regWeight" class="form-input" placeholder="Ex: 80">
                        </div>
                        <div style="flex:1">
                            <label style="font-size: 0.8rem; color: var(--text-muted)">Altura (cm)</label>
                            <input type="number" id="regHeight" class="form-input" placeholder="Ex: 175">
                        </div>
                    </div>
                    <div class="form-group" style="margin-top: 15px;">
                        <label style="font-size: 0.8rem; color: var(--text-muted)">Qual seu objetivo principal?</label>
                        <select id="regGoal" class="form-select">
                            <option value="hipertrofia">Ganhar Massa Muscular (Hipertrofia)</option>
                            <option value="forca">Ganhar Força</option>
                            <option value="emagrecimento">Perder Gordura / Emagrecer</option>
                            <option value="recomposicao">Perder Gordura + Ganhar Massa</option>
                            <option value="condicionamento">Melhorar Condicionamento</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-top: 15px;">
                        <label style="font-size: 0.8rem; color: var(--text-muted)">Dias disponíveis por semana?</label>
                        <select id="regFreq" class="form-select">
                            <option value="3">3 dias (Treino FullBody)</option>
                            <option value="4">4 dias (Split AB)</option>
                            <option value="5">5 dias (Split ABCDE)</option>
                        </select>
                    </div>
                </div>
                <div style="display:flex; gap:10px;">
                    <button class="btn-submit" onclick="finishOnboarding()">SALVAR E GERAR MEU TREINO</button>
                </div>
            </div>
        </div>
    </div>

    <!-- [MODAL: ADICIONAR EXERCÍCIO] -->
    <div class="modal-overlay" id="addExerciseModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2 style="color: var(--accent-primary); font-size:1.2rem;"><i class="fa-solid fa-plus-circle"></i> Adicionar Exercício</h2>
                <button onclick="closeAddExerciseModal()" style="background:none; border:none; color:var(--text-muted); font-size:1.4rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="form-group" style="margin-bottom:15px;">
                <label style="font-size:0.8rem; color:var(--text-muted)">Filtrar por Grupo Muscular:</label>
                <select id="filterMuscleGroup" class="form-select" onchange="renderExerciseLibrary()">
                    <option value="todos">Todos os Grupos Musculares</option>
                    <option value="peito">Peitoral</option>
                    <option value="costas">Costas / Dorsal</option>
                    <option value="quadriceps">Quadríceps</option>
                    <option value="posterior_gluteo">Posterior de Coxa & Glúteos</option>
                    <option value="ombros">Ombros / Deltoides</option>
                    <option value="biceps">Bíceps & Antebraço</option>
                    <option value="triceps">Tríceps</option>
                    <option value="panturrilha_core">Panturrilhas & Core/Abdômen</option>
                    <option value="custom">-- Cadastrar Exercício Personalizado --</option>
                </select>
            </div>

            <!-- Lista de Exercícios da Biblioteca -->
            <div id="libraryListContainer" style="max-height:50vh; overflow-y:auto; padding-right:4px;">
                <!-- Preenchido via JS -->
            </div>

            <!-- Formulário de Exercício Personalizado -->
            <div id="customExerciseForm" style="display:none; max-height:50vh; overflow-y:auto; padding-right:4px;">
                <div class="form-group">
                    <label style="font-size:0.8rem; color:var(--text-muted)">Nome do Exercício</label>
                    <input type="text" id="customExTitle" class="form-input" placeholder="Ex: Agachamento Sumô">
                </div>
                <div class="form-group" style="margin-top:10px;">
                    <label style="font-size:0.8rem; color:var(--text-muted)">Músculo Primário Trabalhado</label>
                    <input type="text" id="customExPrimary" class="form-input" placeholder="Ex: Glúteo Máximo, Adutores">
                </div>
                <div class="form-group" style="margin-top:10px;">
                    <label style="font-size:0.8rem; color:var(--text-muted)">Músculos Secundários</label>
                    <input type="text" id="customExSecondary" class="form-input" placeholder="Ex: Quadríceps, Core">
                </div>
                <div class="form-group" style="margin-top:10px;">
                    <label style="font-size:0.8rem; color:var(--text-muted)">Dica / Motivo de Execução</label>
                    <input type="text" id="customExWhy" class="form-input" placeholder="Ex: Foco no afastamento das pernas e rotação externa de quadril.">
                </div>
                <button class="btn-submit" style="margin-top:15px;" onclick="addCustomExerciseSubmit()">ADICIONAR AO TREINO</button>
            </div>
        </div>
    </div>

    <!-- BARRA NAVEGAÇÃO INFERIOR -->
    <nav class="bottom-nav">
        <div class="nav-content">
            <button class="btn-action btn-gen" onclick="generatePersonalizedWorkout()"><i class="fa-solid fa-wand-magic-sparkles"></i> REGERAR</button>
            <button class="btn-action btn-add-ex" onclick="openAddExerciseModal()"><i class="fa-solid fa-plus"></i> EXERCÍCIO</button>
            <button class="btn-action btn-profile" onclick="openProfileModal()"><i class="fa-solid fa-users"></i> PERFIS</button>
            <button class="btn-action btn-logout" onclick="logoutProfile()"><i class="fa-solid fa-right-from-bracket"></i> SAIR</button>
        </div>
    </nav>

    <script>
        // --- BIBLIOTECA DE EXERCÍCIOS COMPLETA COM MÚSCULOS PRIMÁRIOS E SECUNDÁRIOS ---
        const EXERCISE_LIBRARY = {
            peito: [
                { title: "Supino Reto (Barra)", primary: "Peitoral Maior (Esternal)", secondary: "Tríceps Braquial, Deltoide Anterior", img: "img/supino-reto.png", why: "Exercício multiarticular base para volume e sobrecarga progressiva." },
                { title: "Supino Inclinado (Halteres)", primary: "Peitoral Superior (Clavicular)", secondary: "Deltoide Anterior, Tríceps Braquial", img: "img/supino-inclinado.png", why: "Foco no preenchimento da porção superior do peitoral." },
                { title: "Supino Declinado (Barra/Halter)", primary: "Peitoral Inferior", secondary: "Tríceps Braquial, Deltoide Anterior", img: "img/supino-declinado.png", why: "Ênfase na porção inferior e definição da linha peitoral." },
                { title: "Crossover Polia Alta", primary: "Peitoral Inferior / Esternal", secondary: "Deltoide Anterior", img: "img/cross-over.png", why: "Isolamento com pico de contração e tensão mecânica constante." },

                { title: "Tríceps Pulley Barra Reta", primary: "Tríceps Braquial", secondary: "Ancôneo", img: "img/triceps-pulley.png", why: "Carga consistente para força de empurrão." }
            ],
            panturrilha_core: [
                { title: "Gêmeos em Pé (Máquina/Halter)", primary: "Gastrocnêmio (Panturrilha)", secondary: "Sóleo", img: "img/panturrilha-pe.png", why: "Desenvolvimento da porção superior da panturrilha." },
                { title: "Gêmeos Sentado (Soleira)", primary: "Sóleo (Panturrilha)", secondary: "Gastrocnêmio", img: "img/panturrilha-sentado.png", why: "Trabalha o músculo sóleo profundo com joelhos flexionados." },
                { title: "Abdominal Supra na Polia / Solo", primary: "Reto Abdominal (Superior)", secondary: "Oblíquos", img: "img/abdominal-supra.png", why: "Fortalecimento e hipertrofia da parede abdominal." },
                { title: "Elevação de Pernas (Infra)", primary: "Reto Abdominal (Inferior)", secondary: "Flexores do Quadril", img: "img/abdominal-infra.png", why: "Foco na porção inferior do abdômen." },
                { title: "Prancha Ventral Isométrica", primary: "Transverso do Abdômen, Core", secondary: "Eretores, Glúteos, Ombros", img: "img/prancha.png", why: "Estabilidade de coluna e resistência do core." }
            ]
        };

        // --- GERENCIAMENTO DE ESTADO E MULTIPERFÍS ---
        let activeProfileId = localStorage.getItem('proWorkout_active_profile_id') || null;
        let profilesData = JSON.parse(localStorage.getItem('proWorkout_profiles')) || {};
        
        // Migração do estado antigo se existir apenas um perfil
        const legacyUser = JSON.parse(localStorage.getItem('proWorkout_user'));
        const legacyPlan = JSON.parse(localStorage.getItem('proWorkout_plan'));
        if (legacyUser && Object.keys(profilesData).length === 0) {
            const defaultId = 'prof_' + Date.now();
            profilesData[defaultId] = {
                id: defaultId,
                name: legacyUser.name || 'Meu Perfil',
                weight: legacyUser.weight || '80',
                height: legacyUser.height || '175',
                goal: legacyUser.goal || 'hipertrofia',
                freq: legacyUser.freq || '3',
                workoutPlan: legacyPlan || null
            };
            activeProfileId = defaultId;
            saveProfilesState();
        }

        let userData = null;
        let workoutPlan = null;
        let currentDayIdx = 0;

        window.onload = () => {
            loadCurrentProfileSession();
        };

        function saveProfilesState() {
            localStorage.setItem('proWorkout_profiles', JSON.stringify(profilesData));
            if (activeProfileId) {
                localStorage.setItem('proWorkout_active_profile_id', activeProfileId);
            } else {
                localStorage.removeItem('proWorkout_active_profile_id');
            }
        }

        function loadCurrentProfileSession() {
            if (activeProfileId && profilesData[activeProfileId]) {
                userData = profilesData[activeProfileId];
                workoutPlan = profilesData[activeProfileId].workoutPlan;
                document.getElementById('onboardingModal').style.display = 'none';
                updateUI();
                renderAll();
            } else {
                openProfileModal();
            }
        }

        // --- SISTEMA DE SELEÇÃO E SAIR (LOGOUT) DE PERFIL ---
        function openProfileModal() {
            const hasProfiles = Object.keys(profilesData).length > 0;
            const container = document.getElementById('profilesContainer');
            const modalOverlay = document.getElementById('onboardingModal');
            
            modalOverlay.style.display = 'flex';

            if (hasProfiles) {
                document.getElementById('modalTitle').innerText = "Gerenciar Perfis";
                document.getElementById('closeProfileModalBtn').style.display = activeProfileId ? "block" : "none";
                document.getElementById('profilesListSection').style.display = "block";
                document.getElementById('questionnaireSection').style.display = "none";

                container.innerHTML = '';
                Object.values(profilesData).forEach(p => {
                    const isActive = p.id === activeProfileId;
                    const card = document.createElement('div');
                    card.className = `profile-card-item ${isActive ? 'active-profile' : ''}`;
                    card.innerHTML = `
                        <div>
                            <div style="font-weight:700; color:#fff;">${p.name.toUpperCase()} ${isActive ? '<span style="font-size:0.68rem; color:var(--accent-primary); background:rgba(56,189,248,0.15); padding:2px 6px; border-radius:4px; margin-left:6px;">ATIVO</span>' : ''}</div>
                            <div style="font-size:0.75rem; color:var(--text-muted);">⚖️ ${p.weight}kg | 📏 ${p.height}cm | 🎯 ${p.goal.toUpperCase()}</div>
                        </div>
                        <div style="display:flex; gap:6px;">
                            ${!isActive ? `<button class="action-btn-sm" onclick="selectProfile('${p.id}')"><i class="fa-solid fa-check"></i> Entrar</button>` : ''}
                            <button class="action-btn-sm delete" onclick="deleteProfile('${p.id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                showQuestionnaireForm();
                document.getElementById('closeProfileModalBtn').style.display = "none";
            }
        }

        function closeProfileModal() {
            if (activeProfileId) {
                document.getElementById('onboardingModal').style.display = 'none';
            }
        }

        function showQuestionnaireForm() {
            document.getElementById('modalTitle').innerText = "Novo Perfil / Questionário";
            document.getElementById('profilesListSection').style.display = "none";
            document.getElementById('questionnaireSection').style.display = "block";
            document.getElementById('regName').value = '';
            document.getElementById('regWeight').value = '';
            document.getElementById('regHeight').value = '';
        }

        function selectProfile(pId) {
            activeProfileId = pId;
            saveProfilesState();
            loadCurrentProfileSession();
        }

        function logoutProfile() {
            if (confirm("Deseja sair do perfil atual para selecionar outro ou preencher o questionário?")) {
                activeProfileId = null;
                saveProfilesState();
                userData = null;
                workoutPlan = null;
                document.getElementById('workout-container').innerHTML = '';
                document.getElementById('badgeName').innerText = 'SEM PERFIL';
                document.getElementById('userInfoBanner').innerHTML = '';
                document.getElementById('progressPercent').innerText = '0%';
                document.getElementById('progressBarFill').style.width = '0%';
                openProfileModal();
            }
        }

        function deleteProfile(pId) {
            if (confirm("Tem certeza que deseja excluir este perfil permanentemente?")) {
                delete profilesData[pId];
                if (activeProfileId === pId) {
                    activeProfileId = Object.keys(profilesData)[0] || null;
                }
                saveProfilesState();
                loadCurrentProfileSession();
            }
        }

        function finishOnboarding() {
            const name = document.getElementById('regName').value;
            if (!name) return alert("Por favor, digite seu nome");

            const newId = 'prof_' + Date.now();
            const newProfile = {
                id: newId,
                name: name,
                weight: document.getElementById('regWeight').value || '70',
                height: document.getElementById('regHeight').value || '170',
                goal: document.getElementById('regGoal').value,
                freq: document.getElementById('regFreq').value,
                workoutPlan: null
            };

            profilesData[newId] = newProfile;
            activeProfileId = newId;
            userData = newProfile;

            // Gerar treino inicial
            generatePersonalizedWorkout(false);
            saveProfilesState();
            
            document.getElementById('onboardingModal').style.display = 'none';
            updateUI();
            renderAll();
        }

        // --- GERAÇÃO DE TREINO PERSONALIZADO ---
        function generatePersonalizedWorkout(alertUser = true) {
            if (!userData) return;
            
            const freq = parseInt(userData.freq);
            let newPlan = [];

            if (freq === 3) {
                for (let i = 0; i < 5; i++) {
                    const exercises = i % 2 === 0 ? getFullBodySet() : [];
                    newPlan.push({ day: i, label: `Treino FullBody ${i % 2 === 0 ? 'Ativo' : 'Descanso'}`, exercises: exercises });
                }
            } else if (freq === 4) {
                for (let i = 0; i < 5; i++) {
                    const label = i % 2 === 0 ? "Superior" : "Inferior";
                    const exercises = i < 4 ? getABSet(label) : [];
                    newPlan.push({ day: i, label: `Treino ${label}`, exercises: exercises });
                }
            } else {
                const splits = ["Peito", "Costas", "Pernas", "Ombros", "Braços"];
                for (let i = 0; i < 5; i++) {
                    newPlan.push({ day: i, label: `Treino ${splits[i]}`, exercises: getABCDE(splits[i]) });
                }
            }

            workoutPlan = newPlan;
            profilesData[activeProfileId].workoutPlan = workoutPlan;
            saveProfilesState();

            updateUI();
            renderAll();
            if (alertUser) alert("🎯 Treino gerado com sucesso para o perfil atual!");
        }

        function getFullBodySet() {
            return [
                EXERCISE_LIBRARY.peito[0],
                EXERCISE_LIBRARY.costas[0],
                EXERCISE_LIBRARY.quadriceps[0],
                EXERCISE_LIBRARY.ombros[0],
                EXERCISE_LIBRARY.panturrilha_core[2]
            ].map(ex => ({...ex, completed: false, load: "", id: Math.random()}));
        }

        function getABSet(type) {
            if (type === "Superior") {
                return [
                    EXERCISE_LIBRARY.peito[0],
                    EXERCISE_LIBRARY.costas[0],
                    EXERCISE_LIBRARY.ombros[0],
                    EXERCISE_LIBRARY.biceps[0]
                ].map(ex => ({...ex, completed: false, load: "", id: Math.random()}));
            } else {
                return [
                    EXERCISE_LIBRARY.quadriceps[0],
                    EXERCISE_LIBRARY.posterior_gluteo[0],
                    EXERCISE_LIBRARY.triceps[0],
                    EXERCISE_LIBRARY.panturrilha_core[0]
                ].map(ex => ({...ex, completed: false, load: "", id: Math.random()}));
            }
        }

        function getABCDE(type) {
            let pool = [];
            if (type === "Peito") pool = [...EXERCISE_LIBRARY.peito];
            else if (type === "Costas") pool = [...EXERCISE_LIBRARY.costas];
            else if (type === "Pernas") pool = [...EXERCISE_LIBRARY.quadriceps, ...EXERCISE_LIBRARY.posterior_gluteo];
            else if (type === "Ombros") pool = [...EXERCISE_LIBRARY.ombros];
            else pool = [...EXERCISE_LIBRARY.biceps, ...EXERCISE_LIBRARY.triceps];
            
            return pool.slice(0, 4).map(ex => ({...ex, completed: false, load: "", id: Math.random()}));
        }

        // --- SISTEMA DE ADICIONAR EXERCÍCIOS ---
        function openAddExerciseModal(dayIdx = currentDayIdx) {
            currentDayIdx = dayIdx;
            document.getElementById('addExerciseModal').style.display = 'flex';
            document.getElementById('filterMuscleGroup').value = 'todos';
            renderExerciseLibrary();
        }

        function closeAddExerciseModal() {
            document.getElementById('addExerciseModal').style.display = 'none';
        }

        function renderExerciseLibrary() {
            const group = document.getElementById('filterMuscleGroup').value;
            const container = document.getElementById('libraryListContainer');
            const customForm = document.getElementById('customExerciseForm');

            if (group === 'custom') {
                container.style.display = 'none';
                customForm.style.display = 'block';
                return;
            }

            container.style.display = 'block';
            customForm.style.display = 'none';
            container.innerHTML = '';

            let list = [];
            if (group === 'todos') {
                Object.values(EXERCISE_LIBRARY).forEach(arr => list.push(...arr));
            } else if (EXERCISE_LIBRARY[group]) {
                list = EXERCISE_LIBRARY[group];
            }

            list.forEach(ex => {
                const item = document.createElement('div');
                item.className = 'ex-lib-card';
                item.innerHTML = `
                    <div class="ex-img-wrapper"><img src="${ex.img}" class="ex-img" onerror="this.src='https://placehold.co/120x120/1e293b/38bdf8?text=EXERCICIO'"></div>
                    <div style="flex:1;">
                        <div class="ex-title">${ex.title}</div>
                        <div class="anatomy-info">
                            <span class="primary-muscle">${ex.primary}</span>
                            <span class="secondary-muscles"> | ${ex.secondary}</span>
                        </div>
                        <div class="why-tag">💡 ${ex.why}</div>
                    </div>
                    <button class="action-btn-sm" style="color:var(--accent-primary); border-color:var(--accent-primary);" onclick="addExerciseToWorkout('${encodeURIComponent(JSON.stringify(ex))}')">
                        <i class="fa-solid fa-plus"></i> Add
                    </button>
                `;
                container.appendChild(item);
            });
        }

        function addExerciseToWorkout(jsonStr) {
            if (!workoutPlan || !workoutPlan[currentDayIdx]) return;
            const ex = JSON.parse(decodeURIComponent(jsonStr));
            const newEx = { ...ex, completed: false, load: "", id: Math.random() };

            workoutPlan[currentDayIdx].exercises.push(newEx);
            profilesData[activeProfileId].workoutPlan = workoutPlan;
            saveProfilesState();

            renderAll();
            closeAddExerciseModal();
            alert(`✅ "${ex.title}" adicionado ao treino de ${workoutPlan[currentDayIdx].label}!`);
        }

        function addCustomExerciseSubmit() {
            const title = document.getElementById('customExTitle').value;
            const primary = document.getElementById('customExPrimary').value;
            const secondary = document.getElementById('customExSecondary').value;
            const why = document.getElementById('customExWhy').value;

            if (!title) return alert("Por favor, informe o nome do exercício.");

            const customEx = {
                title: title,
                primary: primary || "Músculos Principais",
                secondary: secondary || "Estabilizadores",
                img: "img/custom-exercise.png",
                why: why || "Exercício personalizado adicionado pelo usuário."
            };

            addExerciseToWorkout(encodeURIComponent(JSON.stringify(customEx)));
            document.getElementById('customExTitle').value = '';
            document.getElementById('customExPrimary').value = '';
            document.getElementById('customExSecondary').value = '';
            document.getElementById('customExWhy').value = '';
        }

        function removeExercise(dayIdx, exId) {
            if (confirm("Deseja remover este exercício do treino?")) {
                workoutPlan[dayIdx].exercises = workoutPlan[dayIdx].exercises.filter(e => e.id !== exId);
                profilesData[activeProfileId].workoutPlan = workoutPlan;
                saveProfilesState();
                renderAll();
            }
        }

        // --- RENDERIZAÇÃO E INTERAÇÃO ---
        function updateUI() {
            if (!userData) return;
            document.getElementById('badgeName').innerHTML = `<i class="fa-solid fa-user"></i> ${userData.name.toUpperCase()}`;
            document.getElementById('userInfoBanner').innerHTML = `
                <span>⚖️ ${userData.weight}kg</span>
                <span>📏 ${userData.height}cm</span>
                <span>🎯 ${userData.goal.toUpperCase()}</span>
                <span>📅 ${userData.freq}X/SEM</span>
                <div style="margin-left:auto; display:flex; gap:6px;">
                    <button class="action-btn-sm" onclick="openProfileModal()"><i class="fa-solid fa-users"></i> Perfis</button>
                    <button class="action-btn-sm delete" onclick="logoutProfile()"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
                </div>
            `;
        }

        function renderAll() {
            const container = document.getElementById('workout-container');
            container.innerHTML = '';

            if (!workoutPlan) return;

            workoutPlan.forEach((dayPlan, idx) => {
                const section = document.createElement('section');
                section.className = `day-section ${idx === currentDayIdx ? 'active' : ''}`;
                
                let exHtml = '';
                if (dayPlan.exercises.length === 0) {
                    exHtml = `
                        <div style="color:var(--text-subtle); padding: 30px; text-align: center; background:rgba(22,30,46,0.4); border-radius:var(--radius-lg); border:1px dashed var(--card-border);">
                            <i class="fa-solid fa-dumbbell" style="font-size:2rem; margin-bottom:10px; opacity:0.4;"></i>
                            <div>Nenhum exercício neste dia.</div>
                            <button class="action-btn-sm" style="margin-top:12px; color:var(--accent-primary); border-color:var(--accent-primary);" onclick="openAddExerciseModal(${idx})">
                                <i class="fa-solid fa-plus"></i> Adicionar Exercício
                            </button>
                        </div>`;
                } else {
                    dayPlan.exercises.forEach(ex => {
                        exHtml += `
                        <div class="exercise-card ${ex.completed ? 'completed' : ''}">
                            <div class="exercise-main-row" onclick="toggleTask(${idx}, ${ex.id})">
                                <div class="checkbox-btn"><i class="fa-solid fa-check" style="color:${ex.completed ? '#fff' : 'transparent'}"></i></div>
                                <div class="ex-img-wrapper"><img src="${ex.img}" class="ex-img" onerror="this.src='https://placehold.co/120x120/1e293b/38bdf8?text=TREINO'"></div>
                                <div style="flex:1">
                                    <div class="ex-title">${ex.title}</div>
                                    <div class="anatomy-info">
                                        <span class="primary-muscle">${ex.primary}</span>
                                        <span class="secondary-muscles"> | ${ex.secondary}</span>
                                    </div>
                                    <div class="why-tag">💡 ${ex.why}</div>
                                </div>
                            </div>
                            <div style="display:flex; justify-content: space-between; align-items:center; border-top: 1px solid var(--card-border); padding-top:10px;">
                                <div class="load-input-group">
                                    <label style="font-size:0.6rem">CARGA</label>
                                    <input type="text" class="load-input" value="${ex.load}" placeholder="0kg" onchange="updateLoad(${idx}, ${ex.id}, this.value)">
                                </div>
                                <div style="display:flex; gap:6px;">
                                    <button class="action-btn-sm" onclick="startTimer(60)"><i class="fa-solid fa-stopwatch"></i> 60s</button>
                                    <button class="action-btn-sm delete" onclick="removeExercise(${idx}, ${ex.id})"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        </div>`;
                    });
                }

                section.innerHTML = `
                    <div class="section-header">
                        <div class="section-title">${dayPlan.label}</div>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <span class="today-badge">${dayPlan.exercises.length} EXERCÍCIOS</span>
                            <button class="action-btn-sm" style="color: var(--accent-primary); border-color: rgba(56, 189, 248, 0.3); background: rgba(56, 189, 248, 0.1);" onclick="openAddExerciseModal(${idx})">
                                <i class="fa-solid fa-plus"></i> Add
                            </button>
                        </div>
                    </div>
                    <div class="exercise-list">${exHtml}</div>
                `;
                container.appendChild(section);
            });
            updateStats();
        }

        function switchDay(idx) {
            currentDayIdx = idx;
            document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
            document.querySelectorAll('.day-section').forEach((s, i) => s.classList.toggle('active', i === idx));
        }

        function toggleTask(dayIdx, exId) {
            const ex = workoutPlan[dayIdx].exercises.find(e => e.id === exId);
            if (ex) {
                ex.completed = !ex.completed;
                profilesData[activeProfileId].workoutPlan = workoutPlan;
                saveProfilesState();
                renderAll();
            }
        }

        function updateLoad(dayIdx, exId, val) {
            const ex = workoutPlan[dayIdx].exercises.find(e => e.id === exId);
            if (ex) {
                ex.load = val;
                profilesData[activeProfileId].workoutPlan = workoutPlan;
                saveProfilesState();
            }
        }

        function updateStats() {
            let total = 0, done = 0;
            if (workoutPlan) {
                workoutPlan.forEach(d => {
                    d.exercises.forEach(e => {
                        total++;
                        if (e.completed) done++;
                    });
                });
            }
            const perc = total > 0 ? Math.round((done/total)*100) : 0;
            document.getElementById('progressPercent').innerText = perc + '%';
            document.getElementById('progressBarFill').style.width = perc + '%';
        }

        function startTimer(sec) {
            if (navigator.vibrate) navigator.vibrate(50);
            alert("Cronômetro de 60s iniciado!");
        }
    </script>
</body>
</html>
