<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Meu Treino">
    <meta name="theme-color" content="#0b0f19">
    <title>Meu Treino Diário | Pro Workout</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(22, 30, 46, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            --accent-glow: rgba(56, 189, 248, 0.35);
            --success-color: #10b981;
            --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;
            --radius-xl: 22px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(129, 140, 248, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: calc(140px + var(--safe-area-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-wrapper {
            width: 100%;
            max-width: 768px;
            padding: 16px 16px 0 16px;
        }

        header {
            margin-bottom: 20px;
            padding: 12px 4px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title i { -webkit-text-fill-color: var(--accent-primary); }

        .today-badge {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-primary);
            border: 1px solid rgba(56, 189, 248, 0.25);
            letter-spacing: 0.5px;
        }

        .progress-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow-card);
        }

        .user-info-banner {
            margin-top: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-gradient);
            border-radius: 10px;
            transition: width 0.4s ease;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .day-tabs-container {
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(20px);
            padding: 10px 0;
            margin-left: -16px;
            margin-right: -16px;
            padding-left: 16px;
            padding-right: 16px;
        }

        .day-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .day-tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            flex: 0 0 auto;
            padding: 10px 18px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: var(--radius-md);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tab-btn.active {
            background: var(--accent-gradient);
            color: #ffffff;
            border-color: var(--accent-primary);
            box-shadow: 0 4px 16px var(--accent-glow);
            transform: translateY(-2px);
        }

        .day-section { display: none; animation: fadeIn 0.35s ease-out; }
        .day-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .section-header {
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title { font-size: 1.2rem; font-weight: 800; color: var(--text-main); }

        .exercise-list { display: flex; flex-direction: column; gap: 14px; }

        .exercise-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 14px;
            box-shadow: var(--shadow-card);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .exercise-card.completed { border-color: var(--success-color); background: rgba(16, 185, 129, 0.05); }

        .exercise-main-row { display: flex; align-items: center; gap: 14px; cursor: pointer; }

        .checkbox-btn {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: 2px solid var(--accent-primary);
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .exercise-card.completed .checkbox-btn { background: var(--success-gradient); border-color: transparent; color: #fff; }

        .ex-img-wrapper {
            width: 68px;
            height: 68px;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #000;
            border: 1px solid var(--card-border);
        }

        .ex-img { width: 100%; height: 100%; object-fit: cover; }

        .ex-title { font-size: 1rem; font-weight: 700; color: var(--text-main); }

        .anatomy-info { font-size: 0.72rem; margin-top: 4px; }
        .primary-muscle { color: var(--accent-primary); font-weight: 700; }
        .secondary-muscles { color: var(--text-muted); }

        .why-tag {
            font-size: 0.68rem;
            color: var(--success-color);
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            margin-top: 5px;
            display: inline-block;
        }

        .load-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }

        .load-input {
            width: 50px;
            background: transparent;
            border: none;
            color: var(--accent-primary);
            font-weight: 700;
            outline: none;
            text-align: right;
            font-family: inherit;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(8px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--bg-dark);
            width: 100%;
            max-width: 500px;
            border: 1px solid var(--accent-primary);
            border-radius: var(--radius-xl);
            padding: 24px;
        }

        .form-select, .form-input {
            width: 100%;
            padding: 14px;
            background: #161e2e;
            border: 2px solid var(--card-border);
            border-radius: 12px;
            color: #fff;
            margin-top: 8px;
            appearance: none;
            font-family: inherit;
        }

        .form-select:focus, .form-input:focus { border-color: var(--accent-primary); outline: none; }

        .form-select option { background: #161e2e; color: #fff; }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .action-btn-sm {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .action-btn-sm.delete:hover { border-color: var(--danger-color); color: var(--danger-color); }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            padding: 12px 16px calc(12px + var(--safe-area-bottom));
            z-index: 1000;
        }

        .nav-content { width: 100%; max-width: 768px; margin: 0 auto; display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-action { flex: 1; min-width: 100px; padding: 14px 8px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.78rem; }
        .btn-gen { background: var(--success-gradient); color: #fff; }
        .btn-reset { background: rgba(239, 68, 68, 0.1); color: var(--danger-color); border: 1px solid var(--danger-color); }
        .btn-profile { background: rgba(56, 189, 248, 0.12); color: var(--accent-primary); border: 1px solid rgba(56, 189, 248, 0.3); }
        .btn-profile:hover { background: rgba(56, 189, 248, 0.25); }

        @media (min-width: 640px) {
            .exercise-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <header>
            <div class="header-top">
                <div class="brand-title"><i class="fa-solid fa-dumbbell"></i> MEU TREINO PRO</div>
                <div class="today-badge" id="badgeName">TREINADOR IA</div>
            </div>

            <div class="progress-card">
                <div class="progress-info">
                    <span>Evolução da Semana</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
                <div class="user-info-banner" id="userInfoBanner">
                    <!-- Preenchido via JS -->
                </div>
            </div>
        </header>

        <div class="day-tabs-container">
            <div class="day-tabs" id="dayTabs">
                <button class="tab-btn active" onclick="switchDay(0)">SEG<span style="font-size:0.6rem">Treino A</span></button>
                <button class="tab-btn" onclick="switchDay(1)">TER<span style="font-size:0.6rem">Treino B</span></button>
                <button class="tab-btn" onclick="switchDay(2)">QUA<span style="font-size:0.6rem">Treino C</span></button>
                <button class="tab-btn" onclick="switchDay(3)">QUI<span style="font-size:0.6rem">Treino D</span></button>
                <button class="tab-btn" onclick="switchDay(4)">SEX<span style="font-size:0.6rem">Treino E</span></button>
            </div>
        </div>

        <main id="workout-container">
            <!-- Os treinos serão injetados aqui -->
        </main>
    </div>

    <!-- [MODAL: QUESTIONÁRIO / ONBOARDING] -->
    <div class="modal-overlay" id="onboardingModal">
        <div class="modal-content">
            <h2 style="color: var(--accent-primary); margin-bottom: 15px;">Personalize seu Perfil</h2>
            <div style="max-height: 70vh; overflow-y: auto; padding-right: 5px;">
                <div class="form-group">
                    <label style="font-size: 0.8rem; color: var(--text-muted)">Nome</label>
                    <input type="text" id="regName" class="form-input" placeholder="Seu nome">
                </div>
                <div style="display:flex; gap:10px; margin-top: 10px;">
                    <div style="flex:1">
                        <label style="font-size: 0.8rem; color: var(--text-muted)">Peso (kg)</label>
                        <input type="number" id="regWeight" class="form-input" placeholder="Ex: 80">
                    </div>
                    <div style="flex:1">
                        <label style="font-size: 0.8rem; color: var(--text-muted)">Altura (cm)</label>
                        <input type="number" id="regHeight" class="form-input" placeholder="Ex: 175">
                    </div>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label style="font-size: 0.8rem; color: var(--text-muted)">Qual seu objetivo principal?</label>
                    <select id="regGoal" class="form-select">
                        <option value="hipertrofia">Ganhar Massa Muscular (Hipertrofia)</option>
                        <option value="forca">Ganhar Força</option>
                        <option value="emagrecimento">Perder Gordura / Emagrecer</option>
                        <option value="recomposicao">Perder Gordura + Ganhar Massa</option>
                        <option value="condicionamento">Melhorar Condicionamento</option>
                    </select>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label style="font-size: 0.8rem; color: var(--text-muted)">Dias disponíveis por semana?</label>
                    <select id="regFreq" class="form-select">
                        <option value="3">3 dias (Treino FullBody)</option>
                        <option value="4">4 dias (Split AB)</option>
                        <option value="5">5 dias (Split ABCDE)</option>
                    </select>
                </div>
            </div>
            <button class="btn-submit" onclick="finishOnboarding()">SALVAR E GERAR MEU TREINO</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-content">
            <button class="btn-action btn-gen" onclick="generatePersonalizedWorkout()"><i class="fa-solid fa-wand-magic-sparkles"></i> REGERAR TREINO</button>
            <button class="btn-action btn-reset" onclick="resetProgress()"><i class="fa-solid fa-rotate-left"></i> ZERAR TREINO</button>
            <button class="btn-action btn-profile" onclick="resetProfile()"><i class="fa-solid fa-user-gear"></i> RESETAR PERFIL</button>
        </div>
    </nav>

    <script>
        // --- BIBLIOTECA DE EXERCÍCIOS BASEADA EM EVIDÊNCIAS (ACSM 2026) ---
        const EXERCISE_LIBRARY = {
            hipertrofia: {
                peito: [
                    { title: "Supino Reto (Barra)", primary: "Peitoral Maior", secondary: "Tríceps, Deltoide Anterior", img: "img/supino-reto.png", why: "Exercício multiarticular base para volume e sobrecarga." },
                    { title: "Supino Inclinado (Halteres)", primary: "Peitoral Superior", secondary: "Deltoide Anterior", img: "img/supino-inclinado.png", why: "Foco na porção clavicular do peitoral." },
                    { title: "Crossover (Polia Alta)", primary: "Peitoral (Esternal)", secondary: "Deltoide Anterior", img: "img/cross-over.png", why: "Isolamento mecânico com tensão constante." }
                ],
                costas: [
                    { title: "Puxada Frontal", primary: "Latíssimo do Dorso", secondary: "Bíceps, Braquial", img: "img/puxada-frontal.png", why: "Desenvolvimento de largura dorsal." },
                    { title: "Remada Baixa", primary: "Romboides, Trapézio", secondary: "Bíceps, Latíssimo", img: "img/remada-baixa.png", why: "Foco na espessura das costas e estabilidade escapular." },
                    { title: "Pulldown Corda", primary: "Latíssimo do Dorso", secondary: "Tríceps (Longo)", img: "img/pulldown-corda.png", why: "Isolamento do latíssimo sem fadiga excessiva do bíceps." }
                ],
                pernas: [
                    { title: "Agachamento Livre", primary: "Quadríceps, Glúteo Máximo", secondary: "Eretores da Espinha, Isquiotibiais", img: "img/agachamento-livre.png", why: "Rei dos exercícios para membros inferiores." },
                    { title: "Leg Press 45°", primary: "Quadríceps", secondary: "Glúteos", img: "img/leg-press.png", why: "Permite alto volume com segurança lombar." },
                    { title: "Cadeira Extensora", primary: "Quadríceps", secondary: "Nenhum", img: "img/extensora.png", why: "Isolamento do quadríceps na fase concêntrica máxima." }
                ]
            },
            forca: {
                base: [
                    { title: "Agachamento Costa", primary: "Membros Inferiores", secondary: "Core", img: "img/agachamento-livre.png", why: "Padrão de movimento fundamental para força sistêmica." },
                    { title: "Supino Reto", primary: "Peitoral, Tríceps", secondary: "Ombros", img: "img/supino-reto.png", why: "Principal empurre horizontal para força bruta." },
                    { title: "Levantamento Terra Romeno", primary: "Cadeia Posterior", secondary: "Lombar, Pegada", img: "img/stiff.png", why: "Fortalecimento de quadril e eretores." }
                ]
            },
            geral: {
                ombros: [
                    { title: "Desenvolvimento Halteres", primary: "Deltoide Anterior/Lateral", secondary: "Tríceps", img: "img/desenvolvimento.png", why: "Construção de base estável para ombros." },
                    { title: "Elevação Lateral", primary: "Deltoide Lateral", secondary: "Trapézio", img: "img/elevacao-lateral.png", why: "Isolamento para largura dos ombros." }
                ],
                biceps: [{ title: "Rosca Direta Polia", primary: "Bíceps Braquial", secondary: "Antebraço", img: "img/rosca-polia.png", why: "Tensão mecânica constante no pico do bíceps." }],
                triceps: [{ title: "Tríceps Corda", primary: "Tríceps (Lateral/Medial)", secondary: "Ancôneo", img: "img/triceps-corda.png", why: "Permite maior amplitude na extensão de cotovelo." }]
            }
        };

        // --- ESTADO GLOBAL ---
        let userData = JSON.parse(localStorage.getItem('proWorkout_user')) || null;
        let workoutPlan = JSON.parse(localStorage.getItem('proWorkout_plan')) || null;
        let currentDayIdx = 0;

        window.onload = () => {
            if (!userData) {
                document.getElementById('onboardingModal').style.display = 'flex';
            } else {
                updateUI();
                renderAll();
            }
        };

        function finishOnboarding() {
            const name = document.getElementById('regName').value;
            if (!name) return alert("Por favor, digite seu nome");

            userData = {
                name: name,
                weight: document.getElementById('regWeight').value,
                height: document.getElementById('regHeight').value,
                goal: document.getElementById('regGoal').value,
                freq: document.getElementById('regFreq').value
            };

            localStorage.setItem('proWorkout_user', JSON.stringify(userData));
            document.getElementById('onboardingModal').style.display = 'none';
            generatePersonalizedWorkout();
        }

        // --- LÓGICA DE GERAÇÃO DE TREINO (O CORAÇÃO DO SISTEMA) ---
        function generatePersonalizedWorkout() {
            if (!userData) return;
            
            const goal = userData.goal;
            const freq = parseInt(userData.freq);
            let newPlan = [];

            // Estratégia de Split baseada em Frequência
            if (freq === 3) {
                // Full Body 3x
                for (let i = 0; i < 5; i++) {
                    const exercises = i % 2 === 0 ? getFullBodySet(1) : [];
                    newPlan.push({ day: i, label: `Treino FB`, exercises: exercises });
                }
            } else if (freq === 4) {
                // AB 2x
                for (let i = 0; i < 5; i++) {
                    const label = i % 2 === 0 ? "Superior" : "Inferior";
                    const exercises = i < 4 ? getABSet(label) : [];
                    newPlan.push({ day: i, label: label, exercises: exercises });
                }
            } else {
                // ABCDE
                const splits = ["Peito", "Costas", "Pernas", "Ombros", "Braços"];
                for (let i = 0; i < 5; i++) {
                    newPlan.push({ day: i, label: splits[i], exercises: getABCDE(splits[i]) });
                }
            }

            workoutPlan = newPlan;
            localStorage.setItem('proWorkout_plan', JSON.stringify(workoutPlan));
            updateUI();
            renderAll();
            alert("🎯 Treino gerado com sucesso baseando-se em seu objetivo!");
        }

        function getFullBodySet(type) {
            const lib = EXERCISE_LIBRARY.hipertrofia;
            return [lib.peito[0], lib.costas[0], lib.pernas[0], EXERCISE_LIBRARY.geral.ombros[0]].map(ex => ({...ex, completed: false, load: "", id: Math.random()}));
        }

        function getABSet(type) {
            const lib = EXERCISE_LIBRARY.hipertrofia;
            if (type === "Superior") {
                return [lib.peito[0], lib.costas[0], EXERCISE_LIBRARY.geral.ombros[0], EXERCISE_LIBRARY.geral.biceps[0]].map(ex => ({...ex, completed: false, load: "", id: Math.random()}));
            } else {
                return [lib.pernas[0], lib.pernas[1], EXERCISE_LIBRARY.geral.triceps[0]].map(ex => ({...ex, completed: false, load: "", id: Math.random()}));
            }
        }

        function getABCDE(type) {
            const lib = EXERCISE_LIBRARY.hipertrofia;
            let pool = [];
            if (type === "Peito") pool = [...lib.peito];
            else if (type === "Costas") pool = [...lib.costas];
            else if (type === "Pernas") pool = [...lib.pernas];
            else if (type === "Ombros") pool = [...EXERCISE_LIBRARY.geral.ombros];
            else pool = [...EXERCISE_LIBRARY.geral.biceps, ...EXERCISE_LIBRARY.geral.triceps];
            
            return pool.map(ex => ({...ex, completed: false, load: "", id: Math.random()}));
        }

        // --- RENDERIZAÇÃO E INTERAÇÃO ---
        function updateUI() {
            if (!userData) return;
            document.getElementById('badgeName').innerText = userData.name.toUpperCase();
            document.getElementById('userInfoBanner').innerHTML = `
                <span>⚖️ ${userData.weight}kg</span>
                <span>📏 ${userData.height}cm</span>
                <span>🎯 ${userData.goal.toUpperCase()}</span>
                <span>📅 ${userData.freq}X/SEM</span>
                <button class="action-btn-sm" style="margin-left: auto; color: var(--danger-color); border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.1);" onclick="resetProfile()">
                    <i class="fa-solid fa-user-slash"></i> Resetar Perfil
                </button>
            `;
        }

        function renderAll() {
            const container = document.getElementById('workout-container');
            container.innerHTML = '';

            if (!workoutPlan) return;

            workoutPlan.forEach((dayPlan, idx) => {
                const section = document.createElement('section');
                section.className = `day-section ${idx === currentDayIdx ? 'active' : ''}`;
                
                let exHtml = '';
                if (dayPlan.exercises.length === 0) {
                    exHtml = '<div style="color:var(--text-subtle); padding: 20px; text-align: center;">Dia de Descanso ou Cardio leve</div>';
                } else {
                    dayPlan.exercises.forEach(ex => {
                        exHtml += `
                        <div class="exercise-card ${ex.completed ? 'completed' : ''}">
                            <div class="exercise-main-row" onclick="toggleTask(${idx}, ${ex.id})">
                                <div class="checkbox-btn"><i class="fa-solid fa-check" style="color:${ex.completed ? '#fff' : 'transparent'}"></i></div>
                                <div class="ex-img-wrapper"><img src="${ex.img}" class="ex-img" onerror="this.src='https://placehold.co/120x120/1e293b/38bdf8?text=TREINO'"></div>
                                <div style="flex:1">
                                    <div class="ex-title">${ex.title}</div>
                                    <div class="anatomy-info">
                                        <span class="primary-muscle">${ex.primary}</span>
                                        <span class="secondary-muscles"> | ${ex.secondary}</span>
                                    </div>
                                    <div class="why-tag">💡 ${ex.why}</div>
                                </div>
                            </div>
                            <div style="display:flex; justify-content: space-between; align-items:center; border-top: 1px solid var(--card-border); padding-top:10px;">
                                <div class="load-input-group">
                                    <label style="font-size:0.6rem">CARGA</label>
                                    <input type="text" class="load-input" value="${ex.load}" placeholder="0kg" onchange="updateLoad(${idx}, ${ex.id}, this.value)">
                                </div>
                                <button class="action-btn-sm" onclick="startTimer(60)">DESCANSO 60s</button>
                            </div>
                        </div>`;
                    });
                }

                section.innerHTML = `
                    <div class="section-header">
                        <div class="section-title">${dayPlan.label}</div>
                        <span class="today-badge">${dayPlan.exercises.length} EXERCÍCIOS</span>
                    </div>
                    <div class="exercise-list">${exHtml}</div>
                `;
                container.appendChild(section);
            });
            updateStats();
        }

        function switchDay(idx) {
            currentDayIdx = idx;
            document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
            document.querySelectorAll('.day-section').forEach((s, i) => s.classList.toggle('active', i === idx));
        }

        function toggleTask(dayIdx, exId) {
            const ex = workoutPlan[dayIdx].exercises.find(e => e.id === exId);
            ex.completed = !ex.completed;
            localStorage.setItem('proWorkout_plan', JSON.stringify(workoutPlan));
            renderAll();
        }

        function updateLoad(dayIdx, exId, val) {
            const ex = workoutPlan[dayIdx].exercises.find(e => e.id === exId);
            ex.load = val;
            localStorage.setItem('proWorkout_plan', JSON.stringify(workoutPlan));
        }

        function updateStats() {
            let total = 0, done = 0;
            if (workoutPlan) {
                workoutPlan.forEach(d => {
                    d.exercises.forEach(e => {
                        total++;
                        if (e.completed) done++;
                    });
                });
            }
            const perc = total > 0 ? Math.round((done/total)*100) : 0;
            document.getElementById('progressPercent').innerText = perc + '%';
            document.getElementById('progressBarFill').style.width = perc + '%';
        }

        function resetProgress() {
            if (!workoutPlan) return;
            if (confirm("Deseja zerar o progresso dos exercícios marcados?")){
                workoutPlan.forEach(d => d.exercises.forEach(e => e.completed = false));
                localStorage.setItem('proWorkout_plan', JSON.stringify(workoutPlan));
                renderAll();
            }
        }

        function resetProfile() {
            if (confirm("Tem certeza que deseja resetar seu perfil?\n\nIsso apagará seus dados (nome, peso, altura, objetivo e frequência) e permitirá cadastrar um novo perfil.")) {
                localStorage.removeItem('proWorkout_user');
                localStorage.removeItem('proWorkout_plan');
                userData = null;
                workoutPlan = null;
                
                document.getElementById('regName').value = '';
                document.getElementById('regWeight').value = '';
                document.getElementById('regHeight').value = '';
                document.getElementById('regGoal').value = 'hipertrofia';
                document.getElementById('regFreq').value = '3';

                document.getElementById('onboardingModal').style.display = 'flex';
                
                document.getElementById('workout-container').innerHTML = '';
                document.getElementById('badgeName').innerText = 'TREINADOR IA';
                document.getElementById('userInfoBanner').innerHTML = '';
                document.getElementById('progressPercent').innerText = '0%';
                document.getElementById('progressBarFill').style.width = '0%';
            }
        }

        function startTimer(sec) {
            if (navigator.vibrate) navigator.vibrate(50);
            alert("Cronômetro de 60s iniciado mentalmente! (Funcionalidade de timer ativa no app)");
        }
    </script>
</body>
</html>
